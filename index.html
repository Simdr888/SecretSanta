<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Secret Santa</title>
<style>
:root{
  --bg:#fbf5ec; --card:#fffdf9; --ink:#2a1f1c; --muted:#6f625c;
  --red:#b3202f; --red-hover:#971a27; --line:#eadfd2;
  --shadow:0 10px 30px rgba(120,60,40,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16110f; --card:#211a17; --ink:#f6ece4; --muted:#b5a69d;
    --red:#c93546; --red-hover:#b02b3b; --line:#3a2e29;
    --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh;
}
main{max-width:560px; margin:0 auto; padding:36px 16px 64px; position:relative; z-index:1}
.hero{text-align:center; margin-bottom:22px}
.hero .emoji{font-size:52px; line-height:1}
h1{
  margin:6px 0 4px; font-size:36px; letter-spacing:-.5px;
  font-family:ui-serif,Georgia,"Times New Roman",serif; color:var(--red);
}
.sub{margin:0; color:var(--muted)}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:26px 22px; box-shadow:var(--shadow); text-align:center;
}
.hello{font-size:22px; font-weight:700; margin:0 0 6px}
.lead{color:var(--muted); margin:0 0 20px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:0; border-radius:12px; padding:12px 20px; font:inherit; font-weight:700;
  background:var(--red); color:#fff; cursor:pointer;
}
.btn:hover{background:var(--red-hover)}
.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 45%,transparent); outline-offset:2px}
.btn.big{width:100%; padding:18px 20px; font-size:19px}
.btn.small{padding:7px 14px; font-size:14px; border-radius:9px}
.btn.ghost{background:transparent; color:var(--red); border:1.5px solid var(--red)}
.btn.ghost:hover{background:color-mix(in srgb,var(--red) 10%,transparent)}
.secret{animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.secret .lead{margin:0}
.secret .target{
  font:700 44px/1.1 ui-serif,Georgia,serif; color:var(--red); margin:8px 0 14px; word-break:break-word;
}
.secret .meta{margin:4px 0}
.secret .hush{margin:18px 0 14px; color:var(--muted)}
@keyframes pop{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:scale(1)}}
.snow{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
.snow i{
  position:absolute; top:-12px; border-radius:50%; background:#fff; opacity:.8;
  box-shadow:0 0 4px rgba(120,150,200,.5); animation:fall linear infinite;
}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0)}}
@media (prefers-reduced-motion:reduce){.snow{display:none}.secret{animation:none}}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<main id="app"></main>
<noscript><p style="text-align:center;padding:24px">Cette page a besoin de JavaScript pour fonctionner.</p></noscript>

<script>
function decodePayload(s){
  try {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bin = atob(s);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    if (o && typeof o.f === "string" && typeof o.t === "string") return o;
  } catch (e) {}
  return null;
}

const app = document.getElementById("app");

function h(tag, attrs, ...children){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c);
  }
  return el;
}

function header(sub){
  const hero = h("header", { class: "hero" },
    h("div", { class: "emoji", "aria-hidden": "true" }, "🎅"),
    h("h1", null, "Secret Santa"));
  if (sub) hero.append(h("p", { class: "sub" }, sub));
  return hero;
}

function viewReveal(p){
  document.title = p.e || "Secret Santa";
  const root = h("div");
  root.append(header(p.e || ""));

  const secret = h("div", { class: "secret", hidden: true },
    h("p", { class: "lead" }, "Tu offres un cadeau à"),
    h("p", { class: "target" }, p.t),
    p.b ? h("p", { class: "meta" }, "💶 Budget : " + p.b) : null,
    p.d ? h("p", { class: "meta" }, "📅 " + p.d) : null,
    h("p", { class: "hush" }, "Chut ! Garde ça pour toi jusqu'à l'échange 🤫"));

  const intro = h("div", null,
    h("p", { class: "hello" }, "Salut " + p.f + " 👋"),
    h("p", { class: "lead" }, "Ton tirage au sort est prêt. Personne d'autre ne peut tomber sur la même personne que toi."));

  const hideBtn = h("button", { type: "button", class: "btn small ghost", hidden: true }, "Masquer");
  const showBtn = h("button", { type: "button", class: "btn big" }, "🎁 Découvrir à qui j'offre");
  showBtn.addEventListener("click", () => {
    intro.hidden = true; showBtn.hidden = true;
    secret.hidden = false; hideBtn.hidden = false;
  });
  hideBtn.addEventListener("click", () => {
    secret.hidden = true; hideBtn.hidden = true;
    intro.hidden = false; showBtn.hidden = false;
  });

  root.append(h("section", { class: "card" }, intro, showBtn, secret, hideBtn));
  return root;
}

function viewMessage(title, text){
  const root = h("div");
  root.append(header(""));
  root.append(h("section", { class: "card" },
    h("p", { class: "hello" }, title),
    h("p", { class: "lead", style: "margin:0" }, text)));
  return root;
}

function route(){
  const hash = location.hash.slice(1);
  let view;
  if (!hash) {
    view = viewMessage("Il te faut ton lien personnel 🎁",
      "Ce tirage au sort fonctionne avec le lien que l'organisateur t'a envoyé. Ouvre-le directement depuis son message.");
  } else {
    const p = decodePayload(hash);
    view = p ? viewReveal(p)
             : viewMessage("Lien incomplet 🤔", "Ce lien semble coupé ou invalide. Redemande-le à l'organisateur et copie-le en entier.");
  }
  app.replaceChildren(view);
}
window.addEventListener("hashchange", route);
route();

(function(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const snow = document.getElementById("snow");
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("i");
    const size = 3 + Math.random() * 5;
    s.style.cssText = "left:" + (Math.random() * 100) + "%;width:" + size + "px;height:" + size + "px;" +
      "animation-duration:" + (9 + Math.random() * 12) + "s;animation-delay:-" + (Math.random() * 20) + "s;" +
      "--dx:" + (Math.random() * 80 - 40) + "px;opacity:" + (0.4 + Math.random() * 0.5);
    snow.append(s);
  }
})();
</script>
</body>
</html>
